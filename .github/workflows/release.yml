name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    # Pinned to macos-13 — see .github/workflows/build.yml for the full
    # rationale. Xcode 16.x ld64 hardcodes LC_MAIN for x86_64 regardless of
    # -mmacosx-version-min flag; macos-13 has older Xcode that honors it.
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Download legacy SDK (used for i386 + x86_64 legacy builds)
        run: |
          # SDK choice per universal_upgrade.md Step 0 (10.6 SDK rejected; 10.13 used)
          curl -fL -o /tmp/sdk.tar.xz https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX10.13.sdk.tar.xz
          EXPECTED_SHA256="1d2984acab2900c73d076fbd40750035359ee1abe1a6c61eafcd218f68923a5a"
          actual=$(shasum -a 256 /tmp/sdk.tar.xz | awk '{print $1}')
          [ "$actual" = "$EXPECTED_SHA256" ] || { echo "::error::SDK checksum mismatch: $actual != $EXPECTED_SHA256"; exit 1; }
          tar xf /tmp/sdk.tar.xz -C /tmp

      # Per audit.md finding 4: pass VERSION through to make so a tagged
      # release ships binaries whose embedded version matches the git
      # tag, not whatever the Makefile happens to hold at tag time.
      - name: Build tri-fat universal (i386 + x86_64 + arm64)
        run: make VERSION="$VERSION" build-all LEGACY_SDK=/tmp/MacOSX10.13.sdk

      - name: Verify legacy slices (load commands, deps, symbol baselines)
        run: ./scripts/verify-legacy-slices.sh build/mac-guest-agent-universal tests

      - name: Run test suite against the universal artifact
        run: ./tests/run_tests.sh ./build/mac-guest-agent-universal

      - name: Prepare release binary
        run: |
          cp build/mac-guest-agent-universal build/mac-guest-agent-darwin-universal
          cd build && shasum -a 256 mac-guest-agent-darwin-universal > checksums.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/mac-guest-agent-darwin-universal
            build/checksums.sha256
          body: |
            ## macOS QEMU Guest Agent ${{ github.ref_name }}

            ### Setup

            **PVE host** (one-time):
            ```bash
            qm set <vmid> --agent enabled=1,type=isa
            ```

            **macOS VM**:
            ```bash
            # One binary covers macOS 10.4 Tiger through 26 Tahoe (i386 + x86_64 + arm64).
            # On Tiger / Leopard / older Snow Leopard, the VM's TLS stack usually
            # can't reach GitHub directly — download from a modern machine and
            # transfer the file.
            sudo cp mac-guest-agent-darwin-universal /usr/local/bin/mac-guest-agent
            sudo chmod +x /usr/local/bin/mac-guest-agent
            sudo /usr/local/bin/mac-guest-agent --install
            ```

            ### Download

            Single download: `mac-guest-agent-darwin-universal` (i386 + x86_64 + arm64, covers macOS 10.4 → 26).
            dyld picks the appropriate slice at load time.

            ### If something goes wrong

            Open an issue at https://github.com/mav2287/mac-guest-agent/issues/new with the following (items 1-3 work even when the binary won't launch; 4-6 only if the binary starts):

            1. `sw_vers` — macOS version
            2. `file /usr/local/bin/mac-guest-agent` — Mach-O fat header
            3. `lipo -info /usr/local/bin/mac-guest-agent` — slice list
            4. `mac-guest-agent --version`
            5. `mac-guest-agent --self-test-json` — note `system_info.selected_arch` in the output
            6. `tail -50 /var/log/mac-guest-agent.log`

            Uses ISA serial via Apple's built-in Apple16X50Serial.kext (present since 10.4 Tiger).
            No custom kext, no SIP changes, no code signing required.
